<!-- ИГРОВОЙ ЭКРАН -->
<div id="screenGame" class="hidden relative w-full h-screen bg-neutral-900 overflow-hidden flex-col items-center justify-center">
    
    <!-- Верхний интерфейс (UI) -->
    <div class="absolute top-4 left-4 z-10 flex flex-col gap-2">
        <div class="bg-black/70 backdrop-blur p-3 rounded-xl border border-neutral-700 text-xs text-neutral-300 shadow-lg">
            <p>🔑 КОМНАТА: <span id="uiRoomCode" class="font-bold text-amber-400">SOLO</span></p>
            <p>👤 <span id="uiPlayerName" class="font-bold text-pink-300">Isaac</span> | 👥 Игроков: <span id="uiPlayerCount" class="font-bold text-emerald-400">1</span></p>
            <p>📍 Координаты: <span id="uiCoord" class="font-bold text-sky-400">(0, 0)</span></p>
        </div>
        <button id="btnSound" class="bg-neutral-800 hover:bg-neutral-700 text-white text-xs px-3 py-1.5 rounded-lg border border-neutral-600 transition">🔊 Звук: Вкл</button>
        <button id="btnLeaveGame" class="bg-rose-900/80 hover:bg-rose-800 text-white text-xs px-3 py-1.5 rounded-lg border border-rose-700 transition">🚪 В Лобби</button>
    </div>

    <!-- Миникарта -->
    <div class="absolute top-4 right-4 z-10 bg-black/80 p-2 rounded-xl border border-neutral-700 flex flex-col items-center">
        <span class="text-[10px] font-bold text-neutral-400 tracking-wider mb-1">КАРТА</span>
        <canvas id="minimapCanvas" width="100" height="100" class="bg-neutral-950 rounded border border-neutral-800"></canvas>
    </div>

    <!-- ОСНОВНОЙ ИГРОВОЙ CANVAS -->
    <div class="w-full h-full flex items-center justify-center">
        <canvas id="gameCanvas" class="block bg-neutral-950 shadow-2xl rounded-lg border-2 border-neutral-800"></canvas>
    </div>

    <!-- Уведомления (Toast) -->
    <div id="toast" class="absolute top-4 left-1/2 -translate-x-1/2 z-20 transition-all duration-300 opacity-0 pointer-events-none">
        <div class="bg-amber-500/20 border border-amber-500 text-amber-300 px-4 py-2 rounded-xl text-sm font-semibold backdrop-blur shadow-lg">
            <span id="toastMsg">Добро пожаловать!</span>
        </div>
    </div>
</div>
