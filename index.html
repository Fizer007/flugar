<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isaac & Madness Flash Online</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik+Dirt&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Подключаем библиотеку PeerJS для сети -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col h-screen w-screen bg-neutral-950 text-neutral-100 overflow-hidden select-none">

    <!-- Уведомления (Toast) -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 border-2 border-amber-500 text-amber-300 px-5 py-2.5 rounded-lg font-bold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none text-xs md:text-sm flex items-center gap-2">
        <span id="toastMsg">Сообщение</span>
    </div>

    <!-- Экран Лобби -->
    <div id="screenLobby" class="flex flex-col items-center justify-center flex-1 p-3 md:p-6 overflow-y-auto z-10">
        <div class="w-full max-w-2xl flash-card p-5 flex flex-col gap-4 max-h-[95vh] overflow-y-auto custom-scroll">
            
            <div class="text-center space-y-1">
                <div class="inline-block bg-red-950 text-red-400 border border-red-800 text-[10px] font-bold px-2.5 py-0.5 rounded uppercase tracking-widest mb-1">
                    PeerJS Multiplayer / Flash Multiverse
                </div>
                <h1 class="font-dirt text-3xl md:text-4xl text-amber-400 tracking-wide drop-shadow-[0_4px_0_#000]">
                    ISAAC <span class="text-red-600">ONLINE</span>
                </h1>
                <p class="text-[11px] text-neutral-400 uppercase tracking-widest font-semibold">Сетевое исследование комнат и чат</p>
            </div>

            <!-- Никнейм -->
            <div class="flex flex-col gap-1 bg-neutral-900/80 p-3 rounded border border-neutral-800">
                <label class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider">Никнейм</label>
                <input type="text" id="inputName" value="Isaac_Player" maxlength="12" class="bg-neutral-950 border-2 border-neutral-700 focus:border-amber-400 text-amber-200 text-center font-bold py-2 px-3 rounded outline-none text-sm font-mono">
            </div>

            <!-- Выбор персонажа -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider flex justify-between items-center">
                    <span>Выбор Персонажа</span>
                    <span id="selectedCharTitle" class="text-amber-400 font-mono text-xs">Isaac</span>
                </label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="charSelectorGrid"></div>
            </div>

            <!-- Управление комнатами -->
            <div class="flex flex-col gap-2.5 mt-2">
                <button id="btnPlaySolo" class="flash-btn flash-btn-red py-3 rounded text-xs font-bold font-flash uppercase tracking-wider flex items-center justify-center gap-2">
                    <span>👤</span> Играть Оффлайн (Соло)
                </button>

                <!-- Авто-сгенерированный код комнаты для друга -->
                <div class="bg-neutral-900 p-3 rounded border border-neutral-800 flex flex-col gap-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-neutral-400 font-bold uppercase text-[10px]">Ваш код комнаты:</span>
                        <span id="myRoomCode" class="font-mono text-amber-400 font-bold text-sm tracking-wider select-all">Генерация...</span>
                    </div>
                    <button id="btnCopyRoomCode" class="flash-btn py-2 rounded text-xs font-bold text-amber-300 uppercase tracking-wider">
                        📋 Скопировать код комнаты
                    </button>
                </div>

                <!-- Подключение по коду друга -->
                <div class="flex items-center gap-2">
                    <input type="text" id="inputRoomId" placeholder="Код друга (например: A1B2)" maxlength="6" class="flex-1 uppercase bg-neutral-900 border-2 border-neutral-700 focus:border-amber-400 text-amber-300 text-center font-mono font-bold py-2.5 px-3 rounded outline-none text-sm">
                    <button id="btnJoinRoom" class="flash-btn py-2.5 px-5 rounded text-xs font-bold font-flash uppercase tracking-wider">
                        Подключиться
                    </button>
                </div>
            </div>

            <div class="text-[10px] text-neutral-500 text-center leading-relaxed">
                Связь напрямую через PeerJS. Передайте код другу, чтобы играть вместе!
            </div>

        </div>
    </div>

    <!-- Игровой Экран -->
    <div id="screenGame" class="hidden flex-col h-full w-full relative">
        
        <div class="absolute top-3 left-3 right-3 z-20 flex items-start justify-between pointer-events-none">
            <div class="bg-neutral-900/90 border-2 border-black p-2.5 rounded-lg shadow-xl pointer-events-auto flex flex-col gap-1 text-xs">
                <div class="flex items-center gap-2 font-mono font-bold text-amber-400">
                    <span>🗝️ КОМНАТА:</span>
                    <span id="uiRoomCode" class="text-white select-all">SOLO</span>
                </div>
                <div class="flex items-center gap-2 text-[11px] text-neutral-400">
                    <span>👤 <span id="uiCharTitle" class="text-amber-300 font-bold">Isaac</span></span>
                    <span>|</span>
                    <span class="text-emerald-400 font-bold">👥 Игроков: <span id="uiPlayerCount">1</span></span>
                </div>
            </div>

            <div class="bg-neutral-950/95 border-2 border-neutral-800 p-2 rounded-lg shadow-2xl pointer-events-auto flex flex-col items-center">
                <div class="text-[9px] font-flash text-neutral-400 mb-1 uppercase tracking-wider">КАРТА</div>
                <canvas id="minimapCanvas" width="110" height="110" class="bg-neutral-900 rounded border border-neutral-800"></canvas>
            </div>
        </div>

        <div class="absolute top-20 left-3 z-20 flex flex-col gap-2">
            <button id="btnMute" class="bg-neutral-900/90 border-2 border-black px-3 py-1.5 rounded text-xs font-bold text-neutral-300 hover:text-white shadow-xl">
                🔊 Звук: Вкл
            </button>
            <button id="btnLeaveGame" class="bg-neutral-900/90 border-2 border-black px-3 py-1.5 rounded text-xs font-bold text-red-400 hover:text-red-300 shadow-xl">
                🚪 В Лобби
            </button>
        </div>

        <canvas id="gameCanvas" class="w-full h-full block bg-black"></canvas>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
